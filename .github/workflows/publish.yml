name: Publish Python Package

on:
  release:
    types: ["published"]

permissions:
  contents: read

jobs:
  verify:
    name: Full release verification
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      expected_version: ${{ github.event.release.tag_name }}

  publish:
    name: Publish to PyPI
    needs: ["verify"]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: .

      - name: Verify downloaded artifact checksums
        run: sha256sum --check SHA256SUMS

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-container:
    name: Publish container image
    needs: ["publish"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  verify-pypi:
    name: Verify published PyPI install
    needs: ["publish"]
    runs-on: ubuntu-latest

    steps:
      - name: Download CI-approved artifacts for registry comparison
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: approved
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and smoke test published package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/mcpzt-pypi-smoke
          for attempt in {1..12}; do
            if /tmp/mcpzt-pypi-smoke/bin/python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              "mcp-zero-trust-layer==${VERSION}"; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              exit 1
            fi
            sleep 10
          done
          /tmp/mcpzt-pypi-smoke/bin/mcpzt version | grep -Fx "${VERSION}"
          /tmp/mcpzt-pypi-smoke/bin/mcpzt init --config /tmp/mcpzt-smoke.yaml
          /tmp/mcpzt-pypi-smoke/bin/mcpzt config validate --config /tmp/mcpzt-smoke.yaml
          /tmp/mcpzt-pypi-smoke/bin/mcpzt config lint --config /tmp/mcpzt-smoke.yaml
          /tmp/mcpzt-pypi-smoke/bin/mcpzt client config \
            --config /tmp/mcpzt-smoke.yaml \
            --kind json \
            --base-url http://127.0.0.1:8765
          cat > /tmp/claude-smoke.json <<'JSON'
          {"mcpServers":{"demo":{"command":"/bin/echo","args":["hello"]}}}
          JSON
          /tmp/mcpzt-pypi-smoke/bin/mcpzt client import \
            --source /tmp/claude-smoke.json \
            --mcpzt-config /tmp/mcpzt-imported.yaml \
            --client-output /tmp/claude-smoke-wrapped.json \
            --wrapper-command /tmp/mcpzt-pypi-smoke/bin/mcpzt
          /tmp/mcpzt-pypi-smoke/bin/mcpzt config validate --config /tmp/mcpzt-imported.yaml
          /tmp/mcpzt-pypi-smoke/bin/mcpzt evidence demo --directory /tmp/mcpzt-pypi-evidence
          /tmp/mcpzt-pypi-smoke/bin/mcpzt evidence verify /tmp/mcpzt-pypi-evidence/bundle.json \
            --trust /tmp/mcpzt-pypi-evidence/trust.json

          /tmp/mcpzt-pypi-smoke/bin/mcpzt evidence check-demo --directory /tmp/mcpzt-pypi-checks
          /tmp/mcpzt-pypi-smoke/bin/mcpzt evidence verify /tmp/mcpzt-pypi-checks/bundle-v2.json \
            --trust /tmp/mcpzt-pypi-checks/trust.json \
            --observers /tmp/mcpzt-pypi-checks/observers.json \
            --request /tmp/mcpzt-pypi-checks/request-preimage.json
      - name: Compare published files with CI-approved artifacts
        run: |
          python - <<'PYPI'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with urllib.request.urlopen(f'https://pypi.org/pypi/mcp-zero-trust-layer/{version}/json', timeout=30) as response:
              published = {item['filename']: item for item in json.load(response)['urls']}
          artifacts = list(Path('approved/dist').iterdir())
          assert len(artifacts) == 2
          for artifact in artifacts:
              expected = hashlib.sha256(artifact.read_bytes()).hexdigest()
              item = published[artifact.name]
              assert item['digests']['sha256'] == expected, artifact.name
              with urllib.request.urlopen(item['url'], timeout=60) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == expected, artifact.name
              print(f'PyPI bytes match CI: {artifact.name}')
          PYPI

  verify-container:
    name: Verify published GHCR runtime
    needs: [publish-container]
    runs-on: ubuntu-latest
    steps:
      - name: Pull and verify exact published image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker pull "$IMAGE"
          DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          REVISION="$(docker image inspect "$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$REVISION" = "$GITHUB_SHA"
          docker run --rm --entrypoint sh -e EXPECTED_VERSION="$VERSION" "$DIGEST" -ec '
            test "$(id -u)" -ne 0
            test "$(mcpzt version)" = "$EXPECTED_VERSION"
            mcpzt evidence check-demo --directory /tmp/ghcr-check-demo
            mcpzt evidence verify /tmp/ghcr-check-demo/bundle-v2.json \
              --trust /tmp/ghcr-check-demo/trust.json \
              --observers /tmp/ghcr-check-demo/observers.json \
              --request /tmp/ghcr-check-demo/request-preimage.json
          '
