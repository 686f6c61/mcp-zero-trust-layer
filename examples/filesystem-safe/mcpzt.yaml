project:
  name: filesystem-safe
  environment: development

runtime:
  mode: stdio
  default_decision: deny
  dry_run: false

auth:
  mode: none

servers:
  - name: filesystem
    transport: stdio
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem@2026.8.31"
      - ./workspace

capability_mappings:
  filesystem:
    tools:
      read_text_file:
        action: filesystem.read
        risk: low
        access: read
        resource_type: file
      write_file:
        action: filesystem.write
        risk: high
        access: write
        resource_type: file

policies:
  # Protocol setup is allowed; business tools still require their own policies.
  - id: allow-mcp-lifecycle
    effect: allow
    match:
      capability_type: method
      capabilities: [initialize, ping]

  - id: allow-safe-filesystem-read
    effect: allow
    match:
      server: filesystem
      action: filesystem.read
    validators:
      - name: filesystem_path
        options:
          path_arg: path
          allowed_roots:
            - ./workspace
          read_only: true

  - id: writes-need-approval
    effect: require_approval
    match:
      server: filesystem
      action: filesystem.write
    validators:
      - name: filesystem_path
        options:
          path_arg: path
          allowed_roots:
            - ./workspace

# Start the wrapper from this directory so the upstream and validators resolve
# ./workspace to the same root. Use absolute paths for deployment configurations.

audit:
  destination: file
  path: ./mcpzt-audit.jsonl
